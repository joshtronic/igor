# Test project — sandbox for kicking the tires.
#
# Adjust REPO_PATH and FORGEJO_REPO to point at your test repo.
# This file is shell-sourced by bin/tick.sh — keep it valid bash.

# Required ─────────────────────────────────────────────────────

# Local checkout. The bot creates worktrees from here.
REPO_PATH=~/Code/foreman-test

# Forgejo owner/repo. The bot will assign itself, push branches,
# open PRs against this.
FORGEJO_REPO=joshtronic/foreman-test

# Optional ─────────────────────────────────────────────────────

# Tick frequency is set by the systemd timer (default 10min).
# Override per-project via a drop-in at
# ~/.config/systemd/user/foreman-tick@test.timer.d/override.conf
# TICK_INTERVAL=10min

# No producer for the test repo — file Agent-labeled issues by hand.
# Uncomment to enable a scheduled enqueue script in the project repo.
# ENQUEUE_INTERVAL=6h
# ENQUEUE_CMD=scripts/enqueue.sh

# Base branch for PRs. Defaults to master.
# PR_BASE=master

# Where report outcomes deliver. Defaults to forgejo (comment on the
# issue and close it).
# REPORT_TARGETS=forgejo
